<dialog id="voices-dlg" class="wide">
  <form method="dialog">
    <h3 id="voices-title">Who was talking?</h3>
    <p class="muted" style="margin:0 0 12px">Play a few lines from each voice and choose who it is. Confirmed assignments stay here as drafts until you save.</p>
    <div class="vr-list" id="voices-list"></div>
    <div class="voices-footer">
      <button class="btn" value="later" title="Close for now; it stays marked on Home">Later</button>
      <button class="btn primary" type="button" id="voices-done">Save and finish</button>
    </div>
  </form>
</dialog>
