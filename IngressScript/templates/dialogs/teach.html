<dialog id="teach-dlg" class="wide">
  <form method="dialog">
    <h3 id="teach-title">Teach voices</h3>
    <p class="muted" style="margin:0 0 12px" id="teach-intro"></p>
    <div class="vr-list" id="teach-list"></div>
    <div class="row">
      <button class="btn" value="later" id="teach-later" title="Close; the moved lines stay in the tray">Not now</button>
      <button class="btn primary" type="button" id="teach-go">Teach</button>
    </div>
  </form>
</dialog>
<div class="teach-tray hidden" id="teach-tray"></div>
