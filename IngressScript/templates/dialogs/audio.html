<dialog id="audio-dlg">
  <h3>Audio file needed</h3>
  <p style="margin:0;color:var(--muted)">Pick <code id="audio-name"></code> to listen along. You can still read the transcript without it.</p>
  <div class="row">
    <button class="btn" id="audio-skip">Read only</button>
    <button class="btn primary" id="audio-pick">Choose audio…</button>
  </div>
  <input type="file" id="audio-input" accept="audio/*,.wav,.mp3" hidden>
</dialog>
