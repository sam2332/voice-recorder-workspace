<dialog id="meeting-dlg">
  <form method="dialog">
    <h3 id="meeting-title">Add to a meeting</h3>
    <div class="mt-pick" id="meeting-list"></div>
    <div class="mt-new">
      <input type="text" id="meeting-new" placeholder="New meeting name" maxlength="120">
      <button class="btn primary" type="button" id="meeting-create">Create and add</button>
    </div>
    <div class="row"><button class="btn" value="close">Close</button></div>
  </form>
</dialog>
