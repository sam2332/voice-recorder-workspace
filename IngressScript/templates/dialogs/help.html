<dialog id="help-dlg">
  <h3>Keyboard shortcuts</h3>
  <div class="keys">
    <span><kbd>Space</kbd> / <kbd>K</kbd></span><span>Play / pause</span>
    <span><kbd>←</kbd> <kbd>→</kbd></span><span>Back / forward 10s</span>
    <span><kbd>J</kbd> <kbd>L</kbd></span><span>Previous / next line</span>
    <span><kbd>Shift</kbd>+<kbd>←</kbd> <kbd>→</kbd></span><span>Previous / next day</span>
    <span><kbd>[</kbd> <kbd>]</kbd></span><span>Slower / faster</span>
    <span><kbd>/</kbd></span><span>Search this day</span>
    <span><kbd>Enter</kbd> / <kbd>Shift+Enter</kbd></span><span>Next / previous match</span>
    <span><kbd>Esc</kbd></span><span>Clear search / close panels</span>
    <span><kbd>F</kbd></span><span>Toggle follow audio</span>
    <span><kbd>Del</kbd></span><span>Trash the focused line</span>
  </div>
  <form method="dialog" class="row"><button class="btn primary">Got it</button></form>
</dialog>
