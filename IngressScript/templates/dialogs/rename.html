<dialog id="rename-dlg">
  <form method="dialog">
    <h3>Rename speaker</h3>
    <input type="text" id="rename-input" required>
    <div class="note">Saved to the voice database, so this name is used for every past day and future recordings.</div>
    <div class="row">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Save</button>
    </div>
  </form>
</dialog>
