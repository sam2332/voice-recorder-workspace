<!-- Library of days -->
<aside class="panel drawer" id="library" aria-label="Library">
  <div class="lib-head">
    <h2>Library</h2>
    <span class="muted" style="font-size:12px" id="lib-count"></span>
    <button class="icon-btn server-only" id="refresh-btn" title="Check for new recordings" aria-label="Refresh library" style="width:30px;height:30px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <button class="lib-home server-only" id="lib-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
    Home &amp; sync <span class="dot hidden" id="lib-home-dot" title="Recorder connected"></span>
  </button>
  <button class="lib-home server-only" id="lib-people">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
    People
  </button>
  <button class="lib-home server-only" id="lib-overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Overview
  </button>
  <button class="lib-home server-only" id="lib-meetings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h5"/></svg>
    Meetings
  </button>
  <div class="lib-actions server-only hidden" id="lib-actions">
    <button class="btn small" id="process-all"></button>
  </div>
  <div class="lib-list" id="lib-list"></div>
</aside>
