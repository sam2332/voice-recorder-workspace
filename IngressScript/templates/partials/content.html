<!-- Transcript / pending -->
<div class="content">
  <div class="home" id="home"><div class="home-inner" id="home-inner"></div></div>
  <div class="toolbar" id="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search this day  ( / )" autocomplete="off">
      <span class="count" id="search-count"></span>
    </label>
    <span class="noise-ctl hidden" id="noise-ctl">
      <button class="btn small" id="noise-toggle"></button>
      <button class="btn small hidden" id="noise-trash">Trash all</button>
    </span>
    <label class="toggle"><input type="checkbox" id="follow" checked> Follow audio</label>
  </div>
  <div class="banner hidden" id="banner">
    <span id="banner-text"></span>
    <button class="btn small primary" id="banner-btn">Re-transcribe</button>
  </div>
  <div class="transcript" id="transcript"><div class="transcript-inner" id="summary-wrap"></div><div class="transcript-inner" id="transcript-inner"></div></div>
  <div class="pending-view hidden" id="pending"><div class="pending-inner" id="pending-inner"></div></div>
  <button class="btn jump hidden" id="jump">↓ Back to current line</button>

  <div class="player">
    <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0">
      <div class="track"><div id="segs"></div><div class="played" id="played"></div></div>
      <div id="ticks"></div>
      <div class="knob" id="knob"></div>
      <div class="tip hidden" id="tip"></div>
    </div>
    <div class="controls">
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="now" id="now"></span>
      <button class="icon-btn" id="back" title="Back 10s (←)" aria-label="Back 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg>
      </button>
      <button class="play" id="play" aria-label="Play">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <button class="icon-btn" id="fwd" title="Forward 10s (→)" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg>
      </button>
      <button class="btn rate" id="rate" title="Playback speed ([ / ])">1×</button>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    </div>
  </div>
</div>
